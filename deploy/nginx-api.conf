# nginx da VPS -> API Pocar Sport (container na porta 127.0.0.1:8080)
# 1. Troque 203-0-113-10.sslip.io pelo IP da VPS com hífens + .sslip.io
# 2. sudo cp deploy/nginx-api.conf /etc/nginx/conf.d/pocar-api.conf && sudo nginx -t && sudo systemctl reload nginx
# 3. sudo certbot --nginx -d 203-0-113-10.sslip.io   (o certbot adiciona o HTTPS e a renovação)
server {
    listen 80;
    server_name 203-0-113-10.sslip.io;

    client_max_body_size 25m;

    access_log /var/log/nginx/pocar-api.access.log;
    error_log  /var/log/nginx/pocar-api.error.log;

    # o endpoint de saúde é só para o Docker; não fica público
    location /actuator/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
